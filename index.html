<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tech Profile</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #38bdf8;
            --line: #06C755;
            --insta: #E1306C;
        }
        body {
            font-family: 'Consolas', 'Monaco', monospace;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: var(--card-bg);
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
        /* タイピングアニメーション */
        .typing {
            font-size: 1.2rem;
            color: var(--accent);
            border-right: 2px solid var(--accent);
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            margin: 0 auto 20px;
            animation: typing 2s steps(15) forwards, blink 0.7s infinite;
        }
        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink { 50% { border-color: transparent } }

        /* スキルスタック */
        .skills {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }
        .skill-tag {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .links { display: flex; flex-direction: column; gap: 12px; }
        .btn {
            text-decoration: none;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            transition: 0.3s;
        }
        .line { background: var(--line); }
        .insta { background: var(--insta); }
        .threads { background: #000; border: 1px solid #444; }
        .btn:hover { opacity: 0.8; transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="card">
    <div class="typing">Hello, Kosen Student!</div>
    
    <p style="text-align:center; font-size: 0.9rem; color: #94a3b8;">
        春から〇〇科。プログラミング勉強中！
    </p>

    <div class="skills">
        <div class="skill-tag">HTML/CSS</div>
        <div class="skill-tag">Python</div>
        <div class="skill-tag">Gadget</div>
        <div class="skill-tag">Gaming</div>
        <div class="skill-tag">Math</div>
    </div>
    
    <div class="links">
        <a href="URL" class="btn line">LINE</a>
        <a href="URL" class="btn insta">Instagram</a>
        <a href="URL" class="btn threads">Threads</a>
    </div>
</div>

</body>
</html>
