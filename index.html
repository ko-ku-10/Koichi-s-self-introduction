<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portal</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; }
        body { font-family: monospace; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: var(--card); width: 85%; max-width: 350px; padding: 40px 20px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .typing { font-size: 1.2rem; color: var(--accent); border-right: 2px solid var(--accent); width: 0; margin: 0 auto 20px; white-space: nowrap; overflow: hidden; animation: typing 2s steps(15) forwards, blink 0.7s infinite; }
        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink { 50% { border-color: transparent } }
        .links { display: flex; flex-direction: column; gap: 12px; }
        .btn { text-decoration: none; color: white; padding: 12px; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .about { background: var(--accent); color: var(--bg); }
        .line { background: #06C755; }
        .insta { background: #E1306C; }
        .gmail { background: #ea4335; }
        .btn:hover { opacity: 0.8; transform: scale(1.03); }
    </style>
</head>
<body>
    <div class="card">
        <div class="typing">Hello, I'm [熊谷航一]</div>
        <div class="links">
            <a href="about.html" class="btn about">📖 自己紹介を見る</a>
            <hr style="border: 0.5px solid #444; width: 100%; margin: 10px 0;">
            <a href="https://line.me/ti/p/TDP6DKL_nz" class="btn line">LINE</a>
            <a href="https://www.instagram.com/ko_ichi1234?igsh=MTl1ZmZteDAxdDlhMQ==" class="btn insta">Instagram</a>
            <a href="mailto:9magaikoichi@gmail.com" class="btn gmail">Gmail</a>
        </div>
    </div>
</body>
</html>
