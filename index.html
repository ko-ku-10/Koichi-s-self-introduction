<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koichi's Portal</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; }
        body { font-family: 'Consolas', monospace; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: var(--card); width: 85%; max-width: 360px; padding: 40px 20px; border-radius: 24px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); }
        .typing { font-size: 1.1rem; color: var(--accent); border-right: 2px solid var(--accent); width: 0; margin: 0 auto 20px; white-space: nowrap; overflow: hidden; animation: typing 2s steps(20) forwards, blink 0.7s infinite; }
        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink { 50% { border-color: transparent } }
        .links { display: flex; flex-direction: column; gap: 14px; }
        .btn { text-decoration: none; color: white; padding: 14px; border-radius: 12px; font-weight: bold; transition: 0.3s; font-size: 0.9rem; }
        .about { background: var(--accent); color: var(--bg); }
        .line { background: #06C755; }
        .insta { background: #E1306C; }
        .gmail { background: #ea4335; }
        .btn:hover { transform: translateY(-3px); opacity: 0.9; }
        .sub-text { font-size: 0.8rem; color: #94a3b8; margin-bottom: 25px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="typing">Hello, I'm 熊谷航一 :)</div>
        <p class="sub-text">電子制御工学科 1年 / 益田出身</p>
        <div class="links">
            <a href="about.html" class="btn about">📖 詳しい自己紹介を読む</a>
            <hr style="border: 0.5px solid #334155; width: 100%; margin: 10px 0;">
            <a href="https://line.me/ti/p/TDP6DKL_nz" class="btn line">LINE (お気軽に!)</a>
            <a href="https://www.instagram.com/ko_ichi1234?igsh=MTl1ZmZteDAxdDlhMQ==" class="btn insta">Instagram</a>
            <a href="mailto:9magaikoichi@gmail.com" class="btn gmail">Gmailを送る</a>
        </div>
    </div>
</body>
</html>
